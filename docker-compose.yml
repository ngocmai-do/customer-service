services:
  customer-db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: pensionat
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  order-db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: customers
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  customer-service:
    build: ./customer-service
    ports:
      - "8081:8081"
    depends_on:
      customer-db:
        condition: service_healthy

  order-service:
    build: ./pensionat-service
    ports:
      - "8080:8080"
    depends_on:
      order-db:
        condition: service_healthy
      customer-service:
        condition: service_started